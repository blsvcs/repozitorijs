name: Sync anonimizetie nolemumi

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python sync_anon_nolemumi.py
      - uses: actions/upload-artifact@v4
        with:
          name: anon-nolemumi-data
          path: data/
