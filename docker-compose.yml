services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nolemumi
      POSTGRES_USER: nolemumi
      POSTGRES_PASSWORD: nolemumi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  api:
    image: python:3.12-slim
    working_dir: /app
    command: bash -lc "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql://nolemumi:nolemumi@postgres:5432/nolemumi
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - postgres

volumes:
  postgres_data:
